<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Amazonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
  :root{
    --bg: #0a1512;
    --bg-1: #0f1e19;
    --bg-2: #15281f;
    --line: rgba(244,241,233,.10);
    --line-strong: rgba(244,241,233,.20);
    --text: #f4f1e6;
    --text-muted: #a7b8ac;
    --text-faint: #718077;
    --accent: #f0a83c;
    --accent-strong: #ffc668;
    --accent-ink: #23150a;
    --radius-lg: 22px;
    --shadow-lg: 0 30px 80px rgba(0,0,0,.45);
    --font-display: "Cinzel", Georgia, serif;
    --font-body: "EB Garamond", Garamond, Georgia, serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, var(--bg-2), var(--bg) 60%);
    color:var(--text);
    font-family:var(--font-body);
    padding:24px;
  }
  h1,h2{ font-family:var(--font-display); margin:0; color:var(--text); }
  .card{
    max-width:520px;
    width:100%;
    background:var(--bg-1);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:48px 40px;
    text-align:center;
  }
  .check{
    width:64px; height:64px; margin:0 auto 22px;
    border-radius:50%;
    background:rgba(240,168,60,.14);
    border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; color:var(--accent-strong);
  }
  h1{ font-size:26px; font-weight:600; letter-spacing:.01em; margin-bottom:14px; }
  p{ color:var(--text-muted); font-size:17px; line-height:1.6; margin:0 0 8px; }
  .faint{ color:var(--text-faint); font-size:14px; font-style:italic; margin-top:22px; }
  a.btn{
    display:inline-block;
    margin-top:28px;
    padding:13px 30px;
    border-radius:999px;
    background:var(--accent);
    color:var(--accent-ink);
    text-decoration:none;
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    transition:background .2s ease, transform .2s ease;
  }
  a.btn:hover{ background:var(--accent-strong); transform:translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Précommande confirmée&nbsp;!</h1>
    <p>Merci pour votre soutien au projet Amazonia. Votre paiement a bien été reçu.</p>
    <p>Un email de confirmation vous sera envoyé. Votre exemplaire est prévu pour Noël 2026.</p>
    <a class="btn" href="/">Retour au site</a>
    <p class="faint">Une question&nbsp;? Écrivez-nous à terence@tema-holding.com</p>
  </div>
</body>
</html>
